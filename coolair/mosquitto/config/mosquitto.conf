# Local dev broker for CoolAir.
# 1883 = plain MQTT (simulator, CLI tools, ESP32 later)
# 9001 = MQTT over WebSockets (the browser dashboard)
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Anonymous access is fine on your own machine. Turn it off (password_file)
# before exposing the broker to any shared network.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
